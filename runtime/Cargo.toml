[package]
name = "cairn-runtime"
description = "Deterministic WebAssembly execution kernel with Merkle-committed execution traces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3.workspace = true
wasm-encoder = { version = "0.255", features = ["wasmparser"] }
wasmparser = { version = "0.255", default-features = false, features = ["validate", "features", "std"] }

[lints]
workspace = true

[dev-dependencies]
# Two reference engines, deliberately of different kinds. `wasmi` interprets; `wasmtime`
# compiles through Cranelift. A bug that both an interpreter and a JIT reproduce is far more
# likely to be in the specification's shared ground than in one implementation, which is
# exactly the confidence a consensus system needs.
wasmi = "1.1"
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std"] }
# Generates arbitrary valid modules, so the differential gate stops testing only the
# instruction combinations someone thought to write down.
# The `wasmparser` feature is what enables `available_imports` and `exports`, which is how the
# generator is made to produce Cairn-shaped modules rather than arbitrary ones. Without it
# those fields panic at generation time.
wasm-smith = { version = "0.255", features = ["wasmparser"] }
arbitrary = "1"
# Prints a generated module back as text. Only reachable from the diagnostic probe, and worth
# the dependency: a failing generated case is unreadable without it.
wasmprinter = "0.255"
wat = "1.255.0"

# No criterion. What this benchmark most needs to report is exact instruction counts and
# ratios between configurations, not confidence intervals on absolute times, and a bench
# harness would add a heavy dependency and minutes of runtime for statistics that do not
# change the conclusion.
[[bench]]
name = "cost"
harness = false
