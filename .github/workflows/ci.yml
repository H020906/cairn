name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Volunteers' results depend on this compiling identically everywhere. Fail on any
  # warning rather than accumulating them.
  RUSTFLAGS: -D warnings

jobs:
  runtime:
    name: Execution kernel (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # rust-toolchain.toml pins the channel, components and targets; this action
        # honours it, so the toolchain is not specified twice.
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build for the browser
        # The kernel has to compile to wasm32 or there is no zero-install worker.
        run: cargo build --workspace --target wasm32-unknown-unknown --release

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cairn's interpreter vs an independent engine
        # THIS GATE IS NOT ADVISORY. Dispute arbitration is sound only while two honest
        # engines running the same instrumented module agree exactly. If they can diverge,
        # arbitration does not catch cheats — it convicts whichever honest volunteer was
        # running the engine that lost. See docs/adr/0003.
        run: cargo test --test differential -- --nocapture

      - name: Note the current limit of this gate
        # Honest accounting: today the comparison runs over a hand-written corpus, which
        # covers every instruction family but cannot find what nobody thought to write down.
        # Random generation is the next step; until it lands, a green gate means "agrees on
        # the cases we wrote", not "agrees".
        run: |
          echo "::notice title=Differential coverage::Corpus-driven, not yet randomised. A pass means the two engines agree on the written cases, not on all inputs."

  # Added as the modules land. Listed here so the intended shape of CI is visible from
  # the start rather than discovered later.
  #
  # coordinator:  JDK 21, ./mvnw verify, Testcontainers against PostgreSQL + Redis
  # dashboard:    Node 20, npm ci, typecheck, test, build
