name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Volunteers' results depend on this compiling identically everywhere. Fail on any
  # warning rather than accumulating them.
  RUSTFLAGS: -D warnings

jobs:
  runtime:
    name: Execution kernel (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # rust-toolchain.toml pins the channel, components and targets; this action
        # honours it, so the toolchain is not specified twice.
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build for the browser
        # The kernel has to compile to wasm32 or there is no zero-install worker.
        #
        # `--lib` rather than `--workspace`: the reference engines are dev-dependencies, and
        # wasmtime compiles WebAssembly to native code, so it will not itself compile *to*
        # WebAssembly. Only the library has to.
        run: cargo build -p cairn-runtime --lib --target wasm32-unknown-unknown --release

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cairn's interpreter vs two independent engines
        # THIS GATE IS NOT ADVISORY. Dispute arbitration is sound only while honest engines
        # running the same instrumented module agree exactly. If they can diverge, arbitration
        # does not catch cheats — it convicts whichever honest volunteer was running the engine
        # that lost. See docs/adr/0003.
        #
        # Two references, deliberately of different kinds: wasmi interprets, wasmtime compiles
        # through Cranelift. A compiler can go wrong in ways an interpreter cannot, and those
        # are exactly the ways that break bit-exact agreement.
        run: cargo test --test differential -- --nocapture

      - name: The exact costs have not moved without saying so
        # The other half of `cargo bench`. Wall-clock cannot be gated — the benchmark measures
        # its own error and it is large. Instruction counts, bisection round counts and witness
        # page counts are exact on every machine, and every claim this project makes rests on
        # one of them. A change here is not necessarily a bug; it is a change that has to be
        # deliberate and explained, which is what a failing assertion forces.
        run: cargo test --test exact_costs -- --nocapture

      - name: The two metering encodings are still interchangeable
        # A work unit may count its instructions through a host call or through an exported
        # global (docs/adr/0009). They must agree on the answer, the fuel total, where fuel runs
        # out, and every snapshot label — everything except the step index, which is private to
        # the parties. If they can drift apart, a unit's arbitration outcome depends on which
        # encoding it was registered with, which is not a property any of this survives.
        run: cargo test --test metering -- --nocapture

      - name: Note the current limit of this gate
        # Honest accounting, kept accurate as coverage changes. Both generators are seeded from
        # fixed constants so a failure is reproducible rather than a flake, which also means a
        # run explores the same inputs every time — breadth comes from the number of cases, not
        # from repetition.
        run: |
          echo "::notice title=Differential coverage::Three engines (Cairn, wasmi, wasmtime). Randomly generated: 300 float expressions and 200 whole modules per run, from fixed seeds. Generated modules are compared under full instrumentation only; the honest-path comparison runs on the float generator and the hand-written corpus, where termination is guaranteed."

  browser:
    name: Browser volunteer (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: A volunteer's manners towards the machine it runs on
        # `browser/policy.js` decides when to take work and how much of the machine to use, and
        # it is pure so that this can be a test rather than a comment. A background worker that
        # drains a phone or spends someone's mobile data is not a bug the user reports; it is a
        # tab they close forever.
        #
        # No install step and no `npm ci` because there is nothing to install. The browser
        # worker has no dependencies and no build — that is a property worth keeping, and a CI
        # job that would start failing the moment one was added is how it stays true.
        run: cd browser && node --test policy.test.js

  # Added as the modules land. Listed here so the intended shape of CI is visible from
  # the start rather than discovered later.
  #
  # coordinator:  JDK 21, ./mvnw verify, Testcontainers against PostgreSQL + Redis
  # dashboard:    Node 20, npm ci, typecheck, test, build
