[workspace]
resolver = "2"
members = [
    "runtime",
    "worker-native",
    "coordinator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Driven by the WebAssembly toolchain: wasmparser and wasmi are both core to this crate and
# both worth staying on current majors, since the project has to survive without its original
# authors. Raise only for a comparable reason — a low MSRV is a courtesy to contributors on
# older distributions.
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/H020906/cairn"
authors = ["The Cairn Authors"]

[workspace.dependencies]
blake3 = "1.5"

[workspace.lints.rust]
# Determinism is a correctness precondition here, not a quality goal. Anything that
# could silently vary between machines is denied outright rather than linted.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Panics inside the execution kernel become network-wide result corruption.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
# Floating-point comparison must always be deliberate in this codebase.
float_cmp = "deny"

[profile.release]
# The trace commitment must be identical across builds; disable anything that could
# introduce build-dependent behaviour into the hot path.
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.bench]
lto = true
codegen-units = 1
